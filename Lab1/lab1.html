<!DOCTYPE html>
<html>
    <head>
	<title>Table</title>
	</head>
	  
	<body>
	
	<table border="1">
	<tr>
	   <td>1</td>
	   <td>2</td>
	   <td>3</td>
	</tr>
	
	<tr>
	   <td>4</td>
	   <td>5</td>

	</tr>
	
	<tr>
	   <td>7</td>

	<tr>
	   <td colspan="2">A</td>
	   <td>B</td>
	</tr>
	
	<tr>
	   <td rowspan="2">C</td>
	   <td>D</td>
	   <td>E</td>
	</tr>
	
	<tr>
	   <td>G</td>
	   <td>F</td>

	</table>
	<br><br>
	
	<table border="1">
	<tr>
	   <td>11</td>
	   <td>12</td>

	   <td rowspan="5">14</td>
	</tr>
	
	<tr>
	   <td colspan="2">15</td>
	   <td colspan="2" rowspan="3" style="text-align:center">16</td>
	</tr>
	
	<tr>
	   <td colspan="2">17</td>
	</tr>
	
	<tr>
	   <td rowspan="2">18</td>

	</tr>
	
	<tr>
	   <td>20</td>

	</table>
	
	</body>
</html>
