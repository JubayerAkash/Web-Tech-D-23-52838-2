<!DOCTYPE html>
<head>
<title> form </title>
<link rel="stylesheet" href="style.css"
</head>

<body>
 <form>
 <label for="fullname">Fullname: </label>
 <input type = "text" name="fullname" id ="fullname" required>
 <br><br>
 
 <label for = "password">Password: </label>
 <input type = "password" name="password" id ="password">
 <br><br>
 
 <label for ="dob">Date of Birth: </label>
 <input type = "Date" name="dob" id ="dob">
  <br><br>
  
 <label for ="image">Choose your image: </label>
 <input type = "file" name="photo" id ="photo">
  <br><br>
  
  <label for ="gender">Gender: </label>
     <input type = "radio" name="gender" id ="gender" value="male">Male
     <input type = "radio" name="gender" id ="gender" value="female">Female
  <br><br>
  
  <label for ="religion">Religion: </label>
     <input type = "radio" name="r1" id ="r1" value="islam" checked>Islam
     <input type = "radio" name="r2" id ="r2" value="hindu">Hinduism
  <br><br>
  
    <div>
	<label for ="department">Department:</label>
	<select name="department">
	  <option value="CSE" selected>CSE</option>
	  <option value="EEE">EEE</option>
	  </select>
	  </div><br>
	  
	  <div>
	  <label for ="address">Write down your address:</label><br>
	  <textarea id="address" rows="10"></textarea>
	  </div><br>
	  
	  <div>
	  <input type = "submit" value="Register">
	  <input type = "reset" value="Clear" disabled>
	  </div><br>
	  
</form>	  
</body>
</html>
